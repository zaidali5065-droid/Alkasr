<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حارس القصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=El+Messiri:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1330;--bg2:#161e47;--card:#1d2757;--card2:#24306a;--line:#33407f;
  --gold:#f2c14e;--gold2:#ffdd85;--ink:#f4f1e8;--mute:#a9b0d6;
  --ok:#2fbf71;--bad:#e5484d;--blue:#4c8dff;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(ellipse at 50% -10%,#2a3680 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:17px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 85% 55%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 50% 40%,#fff4 50%,transparent 51%),radial-gradient(1.5px 1.5px at 20% 90%,#fff5 50%,transparent 51%);}
h1,h2,h3{font-family:'El Messiri',serif;margin:0;line-height:1.3}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.screen{display:none;animation:fade .35s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;background:var(--card2);border:1px solid var(--line);transition:transform .12s,background .2s}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2600;border:0;box-shadow:0 6px 20px #f2c14e40}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:11px}
.btn.red{background:#5a1f2a;border-color:#8a2f3d}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mute{color:var(--mute)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 0 10px}

/* HOME */
.hero{text-align:center;padding:26px 0 10px}
.castle{font-size:84px;filter:drop-shadow(0 8px 24px #f2c14e55);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero h1{font-size:44px;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px 0 0;color:var(--mute)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.mode{text-align:right;padding:22px;border-radius:22px;background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);transition:transform .15s,border-color .2s;position:relative;overflow:hidden}
.mode:hover{border-color:var(--gold)}
.mode:active{transform:scale(.98)}
.mode .ic{font-size:44px}
.mode h2{font-size:24px;margin:6px 0 4px;color:var(--gold2)}
.mode p{margin:0;color:var(--mute);font-size:15px}
.mode .tag{position:absolute;top:16px;left:16px;font-size:12px;background:#0006;border:1px solid var(--line);padding:3px 10px;border-radius:99px;color:var(--mute)}
.lb{margin-top:18px}
.lb ol{margin:8px 0 0;padding:0 22px 0 0}
.lb li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}

/* ADVENTURE */
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:10px}
.room{aspect-ratio:3/4;border-radius:70px 70px 14px 14px;border:2px solid var(--line);background:linear-gradient(180deg,#2b376f,#141b40);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;position:relative;transition:transform .15s}
.room .ri{font-size:40px}
.room b{font-family:'El Messiri';font-size:18px}
.room small{color:var(--mute);font-size:13px}
.room.open{border-color:var(--gold);box-shadow:0 0 0 4px #f2c14e22,0 10px 30px #f2c14e33;animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px #f2c14e18,0 10px 34px #f2c14e55}}
.room.done{border-color:var(--ok);background:linear-gradient(180deg,#1f5a43,#122a2a)}
.room.lock{opacity:.45;pointer-events:none}
.room .badge{position:absolute;top:8px;font-size:22px}
.qbox{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.timer{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--gold),var(--ok));width:100%;transition:width .25s linear}
.qtext{font-size:24px;font-weight:800;text-align:center;padding:24px 16px;min-height:120px;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.qtext{font-size:21px}.hero h1{font-size:36px}}
.opt{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;text-align:right;display:flex;gap:12px;align-items:center;transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.97)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--gold);font-size:16px}
.opt.ok{background:#1d5c3f;border-color:var(--ok)}
.opt.bad{background:#5c1d27;border-color:var(--bad);animation:shake .35s}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lifes{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.feedback{text-align:center;font-weight:800;font-size:20px;min-height:34px;margin-top:12px}
.center{text-align:center}
.big{font-size:72px}
.chest{font-size:110px;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}

/* TEAMS */
.setup-teams{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font-weight:700}
.chip.on{background:var(--gold);color:#3a2600;border-color:var(--gold)}
.scores{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.score{border-radius:16px;padding:10px 14px;background:var(--bg2);border:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;transition:all .25s}
.score.turn{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 25%,transparent);transform:translateY(-2px)}
.score .nm{font-weight:800;color:var(--tc)}
.score .pt{font-size:26px;font-weight:800;font-family:'El Messiri'}
.score .lf{font-size:12px;color:var(--mute)}
.board{display:grid;gap:8px;overflow-x:auto}
.bh{background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px;font-weight:800;font-size:15px;line-height:1.3;min-height:66px;display:flex;flex-direction:column;justify-content:center}
.bh span{font-size:22px}
.cell{background:linear-gradient(180deg,#2d3d94,#1b2563);border:1px solid #3e50b3;border-radius:12px;font-family:'El Messiri';font-size:26px;font-weight:700;color:var(--gold2);padding:14px 0;transition:transform .12s}
.cell:active{transform:scale(.95)}
.cell.used{background:var(--bg2);color:transparent;border-color:var(--line);pointer-events:none}
.cell.used::after{content:"✓";color:var(--mute);font-size:18px}
@media(max-width:560px){.cell{font-size:18px;padding:10px 0}.bh{font-size:12px;min-height:58px}.bh span{font-size:18px}}

/* MODAL */
.modal{position:fixed;inset:0;background:#05081cdd;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
.modal.on{display:flex}
.mbox{width:100%;max-width:820px;margin:auto 0;animation:fade .25s}
.steal{margin-top:14px;text-align:center}

/* TEACHER */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:700;white-space:nowrap}
.tab.on{background:var(--gold);color:#3a2600;border-color:var(--gold)}
.qitem{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--line)}
.qitem .t{flex:1;min-width:0}
.qitem .t b{display:block}
.qitem .t small{color:var(--mute)}
.lvl{flex:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;color:var(--gold)}
.form{display:grid;gap:10px}
.form label{font-size:14px;color:var(--mute);display:grid;gap:4px}
.optedit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.optedit input[type=radio]{width:22px;height:22px;accent-color:var(--ok)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:var(--gold);color:#3a2600;font-weight:800;padding:10px 20px;border-radius:99px;transition:transform .3s;z-index:99;box-shadow:0 10px 30px #0008}
.toast.on{transform:translateX(-50%) translateY(0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ===== ADVENTURE (illustrated) ===== */
.disp{font-family:'Lalezar','El Messiri',serif;font-weight:400;letter-spacing:0}
.castle svg{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
.hero h1{font-family:'Lalezar','El Messiri',serif;font-weight:400;font-size:52px}
.btn.big{padding:15px 26px;font-size:20px}
.btn.gold{box-shadow:0 5px 0 #b07d14,0 10px 22px #f2c14e40}
.btn.gold:active{transform:translateY(3px);box-shadow:0 2px 0 #b07d14}

.namecard{max-width:440px;margin:10px auto;text-align:center;background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:26px;padding:20px}
.namecard .form{text-align:right;margin-top:14px}
.kprev{width:140px;margin:0 auto;animation:hop 1.4s ease-in-out infinite}
.kprev svg{width:100%;height:auto}
.namecard h2{font-size:32px;color:var(--gold2)}
.swatches{display:flex;gap:12px;justify-content:center;margin-top:8px}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:4px solid #fff3;box-shadow:0 4px 0 #0006}
.sw.on{border-color:var(--gold);transform:scale(1.12)}
@keyframes hop{50%{transform:translateY(-8px)}}

.aqtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hearts{display:flex;gap:3px;background:#0006;border:1px solid var(--line);border-radius:99px;padding:6px 10px}
.heart svg{width:22px;height:20px;display:block;fill:#ff4d6d;filter:drop-shadow(0 2px 0 #8a1030)}
.heart.lost svg{fill:#3a3f5c;filter:none}
.heart.breaking svg{animation:hbreak .8s}
@keyframes hbreak{0%{fill:#ff4d6d;transform:scale(1.5)}40%{transform:scale(1.6) rotate(-15deg)}100%{transform:scale(1)}}
.coin{display:flex;align-items:center;gap:6px;background:#0006;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 8px;font-weight:800;font-size:18px;color:var(--gold2)}
.cn{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f2c14e 45%,#b07d14);box-shadow:inset 0 -2px 0 #8a5d0a;display:inline-block}
.keys{display:flex;align-items:center;gap:6px;background:#0006;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:800;color:var(--gold2)}
.keys svg{width:34px;height:auto}
.who{display:flex;align-items:center;gap:6px;font-weight:800}
.who .mini svg{width:30px;height:auto;display:block}

/* map */
.mapwrap{border-radius:26px;overflow:hidden;border:1px solid var(--line);
  background:
   radial-gradient(ellipse 60% 40px at 20% 300px,#26573f 98%,transparent),
   radial-gradient(ellipse 70% 50px at 85% 310px,#22503a 98%,transparent),
   linear-gradient(180deg,#141c4a 0,#1d2a66 230px,#1f4a38 300px,#163a2b 100%)}
.map{position:relative;width:340px;margin:0 auto}
.map>svg.road{position:absolute;inset:0;pointer-events:none}
.map .castlebox{position:absolute;top:0;left:0;width:340px}
.map .castlebox svg{width:340px;height:auto;display:block}
.node{position:absolute;width:84px;height:84px;border-radius:50%;font-size:38px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff) 0,var(--c) 55%);
  box-shadow:0 8px 0 color-mix(in srgb,var(--c) 55%,#000),0 14px 22px #0008;border:4px solid #ffffff40;transition:transform .15s}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000)}
.node.lock{--c:#5a6382 !important;font-size:30px}
.node.lock>.ic{filter:grayscale(1) opacity(.5)}
.node.done{border-color:var(--gold)}
.node.open{animation:npulse 1.6s infinite}
@keyframes npulse{0%,100%{outline:0 solid #f2c14e00}50%{outline:10px solid #f2c14e40}}
.node .nb{position:absolute;top:-6px;left:-6px;width:32px;height:32px;border-radius:50%;background:#10163a;border:2px solid var(--line);display:grid;place-items:center;font-size:16px}
.node.done .nb{border-color:var(--gold);background:#2b2208}
.node .nl{position:absolute;top:94px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:14px;text-shadow:0 2px 4px #000;color:#fff}
.node .ns{position:absolute;top:114px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;letter-spacing:1px}
.avatar{position:absolute;width:62px;pointer-events:none;animation:hop 1s ease-in-out infinite;z-index:3}
.avatar svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 6px #0008)}
.avatar .say{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a2e;font-weight:800;font-size:13px;padding:3px 10px;border-radius:12px;white-space:nowrap}
.deco{position:absolute;pointer-events:none}
.deco svg{display:block;width:100%;height:auto}
.flame{transform-origin:50% 100%;animation:flick .25s infinite alternate}
@keyframes flick{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.15) scaleX(.9)}}
.win{animation:wglow 2.6s infinite alternate}
@keyframes wglow{to{opacity:.55}}
.flag{animation:flagw 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes flagw{to{transform:scaleX(.8) skewY(6deg)}}

/* door transition */
.door{position:fixed;inset:0;z-index:70;display:none;perspective:1400px}
.door.on{display:block}
.door .dh{position:absolute;top:0;bottom:0;width:50.5%;
  background:
    radial-gradient(circle,#c9b27a 0 4px,transparent 5px) 0 0/44px 44px,
    linear-gradient(180deg,transparent 18%,#3a3f4a 18% 21%,transparent 21% 79%,#3a3f4a 79% 82%,transparent 82%),
    repeating-linear-gradient(90deg,#7a4722 0 34px,#5e3518 34px 37px);
  box-shadow:inset 0 0 60px #000a;transition:transform .9s cubic-bezier(.6,0,.3,1)}
.door .dl{left:0;transform-origin:left center}
.door .dr{right:0;transform-origin:right center}
.door.open .dl{transform:rotateY(78deg)}
.door.open .dr{transform:rotateY(-78deg)}
.door .ring1{position:absolute;top:70%;width:34px;height:34px;border:6px solid #e2c37a;border-radius:50%}
.door .dl .ring1{right:16px}.door .dr .ring1{left:16px}
.door .dt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;z-index:2;transition:opacity .3s;text-shadow:0 3px 10px #000}
.door.open .dt{opacity:0}
.door .dt .di{font-size:80px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.door .dt b{font-family:'Lalezar',serif;font-weight:400;font-size:44px;color:var(--gold2)}
.door .dt small{font-size:17px;background:#000a;padding:4px 14px;border-radius:99px}

/* question */
#s-aq{--rc:#2f8cff}
.roombar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 45%,#0000),#0000);border-radius:16px;padding:6px 12px;margin-bottom:6px;border-inline-start:5px solid var(--rc)}
.roomname{font-size:24px}
.torches{display:flex;gap:10px}
.torch{width:14px;height:30px;position:relative}
.torch::after{content:"";position:absolute;bottom:0;left:4px;width:6px;height:13px;background:#6b4a2a;border-radius:2px}
.torch i{position:absolute;top:0;left:0;width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3a3f5c}
.torch.lit i{background:radial-gradient(circle at 50% 70%,#fff6b0,#ffb020 50%,#ff5a1f);box-shadow:0 0 14px #ffb020;animation:flick .2s infinite alternate}
.torch.out i{background:#5c1d27}
.torch.cur i{background:#3a3f5c;outline:2px dashed var(--gold);outline-offset:2px}
.guardrow{display:flex;align-items:flex-end;gap:10px;margin:4px 0 -14px;position:relative;z-index:2;min-height:96px}
.guard{width:92px;flex:none}
.guard svg{width:100%;height:auto;display:block}
.guard .mo{display:none}
.guard[data-mood=n] .mo-n,.guard[data-mood=s] .mo-s,.guard[data-mood=l] .mo-l{display:inline}
.guard[data-mood=l]{animation:laugh .25s 4}
.guard[data-mood=s]{animation:jump .4s}
@keyframes laugh{50%{transform:rotate(-4deg) translateY(-3px)}}
@keyframes jump{50%{transform:translateY(-10px) scale(1.05)}}
.bubble{background:#fff;color:#1a1a2e;font-weight:800;font-size:16px;padding:10px 14px;border-radius:18px;position:relative;margin-bottom:26px;max-width:260px}
.bubble::before{content:"";position:absolute;bottom:10px;right:-9px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bubble.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.combo{margin-inline-start:auto;margin-bottom:28px;font-family:'Lalezar',serif;font-size:26px;color:#ffb020;text-shadow:0 0 12px #ff5a1f;opacity:0}
.combo.on{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.scroll{position:relative;background:linear-gradient(180deg,#fbf1d6,#efd9a6);color:#3a2a12;border-radius:20px;padding:26px 18px 22px;text-align:center;box-shadow:0 6px 0 #b8935a,0 16px 30px #0007;border:3px solid #d9b977}
.scroll::before,.scroll::after{content:"";position:absolute;top:10px;bottom:10px;width:6px;border-radius:4px;background:#d9b97788}
.scroll::before{right:8px}.scroll::after{left:8px}
.scroll small{display:block;color:#8a6a35;font-weight:800;font-size:14px}
.qt{font-size:23px;font-weight:800;line-height:1.5;margin-top:4px;min-height:70px;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.scroll.shake{animation:shake .4s}
.ring{position:absolute;top:-24px;left:14px;width:58px;height:58px;background:#10163a;border-radius:50%;box-shadow:0 4px 0 #0007}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .rbg{stroke:#2a3366}
.ring .rfg{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px}
.ring.urgent .rfg{stroke:var(--bad)}
.ring.urgent{animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.aopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:560px){.aopts{grid-template-columns:1fr}.qt{font-size:21px}}
.aopt{background:var(--oc);color:#fff;border-radius:18px;padding:14px;font-size:19px;font-weight:800;text-align:right;display:flex;gap:12px;align-items:center;
  box-shadow:0 6px 0 color-mix(in srgb,var(--oc) 55%,#000);transition:transform .1s,box-shadow .1s,opacity .3s;text-shadow:0 1px 2px #0005}
.aopt:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--oc) 55%,#000)}
.aopt .k{flex:none;width:34px;height:34px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;font-size:17px}
.aopt.dim{opacity:.28}
.aopt.ok{--oc:#1fae5b;outline:4px solid #b6ffd2;animation:okpop .5s}
.aopt.ok .k::after{content:"✓"}.aopt.ok .k{font-size:0}.aopt.ok .k::after{font-size:20px}
.aopt.bad{--oc:#59606f;animation:shake .4s}
.aopt.gone{visibility:hidden}
.aopt:disabled{cursor:default}
@keyframes okpop{40%{transform:scale(1.06)}}
.lifes{display:flex;gap:10px;justify-content:center;margin-top:16px}
.ll{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;background:#0006;border:2px solid var(--line);font-weight:800;font-size:15px}
.ll span{font-size:18px}
.ll:disabled{opacity:.3}
.float{position:fixed;z-index:90;font-family:'Lalezar',serif;font-size:34px;color:#fff36b;text-shadow:0 3px 0 #b07d14,0 0 14px #000;pointer-events:none;animation:floatup 1.1s ease-out forwards;transform:translateX(-50%)}
@keyframes floatup{to{transform:translate(-50%,-90px);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
#flash.ok{background:radial-gradient(circle,#2fbf7100 40%,#2fbf7166);animation:fl .6s}
#flash.bad{background:radial-gradient(circle,#e5484d00 40%,#e5484d88);animation:fl .6s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

/* key / fail / end */
.keyspin{width:170px;margin:0 auto;animation:kspin 1.2s cubic-bezier(.2,1.4,.4,1)}
.keyspin svg{width:100%;height:auto;filter:drop-shadow(0 0 18px #f2c14e)}
@keyframes kspin{from{transform:rotate(-540deg) scale(.1)}}
.stars{font-size:40px;letter-spacing:4px;margin:4px 0}
.stars .s{display:inline-block;color:#ffd23f;text-shadow:0 0 12px #f2c14e;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stars .s.off{color:#3a3f5c;text-shadow:none}
.guardbig{width:150px;margin:0 auto}
.guardbig svg{width:100%;height:auto}
.guardbig .mo{display:none}.guardbig .mo-l{display:inline}
.guardbig{animation:laugh .25s 6}
.endcard{max-width:560px;margin:10px auto;text-align:center;background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:28px;padding:22px}
.endcard h1{font-family:'Lalezar',serif;font-weight:400;font-size:40px;color:var(--gold2)}
.chestsvg{width:220px;height:auto;display:block;margin:0 auto}
.chestsvg .lid{transform-box:view-box;transform-origin:20px 62px;transition:transform .9s cubic-bezier(.3,1.7,.5,1)}
.chestsvg.open .lid{transform:rotate(-32deg)}
.chestsvg .cg{opacity:0;transition:opacity .8s .3s}
.chestsvg.open .cg{opacity:1}
.rank{display:inline-block;margin:6px 0 4px;padding:6px 20px;border-radius:99px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2600;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b07d14}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.tile{background:#0005;border:1px solid var(--line);border-radius:16px;padding:10px 6px}
.tile b{display:block;font-family:'Lalezar',serif;font-weight:400;font-size:28px;color:var(--gold2);line-height:1.2}
.tile small{color:var(--mute);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<canvas id="fx"></canvas>
<div class="wrap">

<!-- ========== HOME ========== -->
<section class="screen on" id="s-home">

    <button class="mode" onclick="advStart()">

    </button>
  </div>
  <div class="card lb">

  </div>

<!-- ========== ADVENTURE: NAME ========== -->
<section class="screen" id="s-aname">

</section>

<!-- ========== ADVENTURE: MAP ========== -->
<section class="screen" id="s-amap">

</section>

<!-- ========== ADVENTURE: QUESTION ========== -->

      <div class="qt" id="aqText"></div>
    </div>
    <div class="aopts" id="aqOpts"></div>

<!-- ========== ADVENTURE: END ========== -->
<section class="screen" id="s-aend">

</section>

<!-- ========== TEAMS: SETUP ========== -->
<section class="screen" id="s-tsetup">

    </label>

    </label>

    </label>

</section>

<!-- ========== TEAMS: BOARD ========== -->
<section class="screen" id="s-board">

  <div class="board" id="board"></div>
</section>

<!-- ========== TEAMS: END ========== -->
<section class="screen" id="s-tend">

</section>

  <div id="tBody"></div>
</section>

</div>

let AC;
function beep(freqs,dur=.12,type='sine',vol=.15){
  if(!DB.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const t=AC.currentTime+i*dur;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur*1.7)})}catch(e){}
}

const FX={P:[],run:false};
const rnd=Math.random;
function fxLoop(){
  const c=$('fx'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  FX.P=FX.P.filter(p=>p.life-->0&&p.y<c.height+40);
  FX.P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.min(1,p.life/25);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.round){x.beginPath();x.arc(0,0,p.s/2,0,7);x.fill()}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(FX.P.length)requestAnimationFrame(fxLoop);else FX.run=false;
}
function fxStart(){const c=$('fx');if(!FX.run){c.width=innerWidth;c.height=innerHeight;FX.run=true;requestAnimationFrame(fxLoop)}}
const CCOL=['#f2c14e','#ffdd85','#2fbf71','#4c8dff','#e5484d','#fff','#ff7ab6'];

function burst(x,y,n=40,cols=CCOL){for(let i=0;i<n;i++){const a=rnd()*6.28,v=3+rnd()*7;FX.P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.28,r:0,vr:.2,s:5+rnd()*7,c:cols[rnd()*cols.length|0],round:rnd()<.5,life:55+rnd()*30})}fxStart()}
function burstEl(el,n,cols){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n,cols)}

  const list=DB.qs.filter(q=>tFilter==='all'||q.cat===tFilter).sort((a,b)=>a.cat.localeCompare(b.cat)||a.lvl-b.lvl);
  $('tBody').innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <select style="width:auto;flex:1;min-width:160px" onchange="tFilter=this.value;tQs()"><option value="all">كل الأقسام (${AR(DB.qs.length)})</option>${DB.cats.map(c=>`<option value="${c.id}" ${tFilter===c.id?'selected':''}>${c.icon} ${esc(c.name)} (${AR(DB.qs.filter(q=>q.cat===c.id).length)})</option>`).join('')}</select>
      <button class="btn gold sm" onclick="qForm()">＋ سؤال جديد</button>
    </div>
    ${list.map(q=>`<div class="qitem"><span class="lvl">${AR(q.lvl*100)}</span><div class="t"><b>${esc(q.q)}</b><small>${catOf(q.cat).icon} ${esc(catOf(q.cat).name)} · ✔ ${esc(q.opts[q.a])}</small></div>
      <button class="btn sm" onclick="qForm('${q.id}')">✏️</button></div>`).join('')||'<p class="mute">لا توجد أسئلة.</p>'}
    <p class="mute" style="font-size:13px;margin-top:10px">💡 المغامرة تحتاج ${AR(QPR)} أسئلة على الأقل في القسم، ولوحة الفرق تحتاج سؤالاً لكل مستوى (١٠٠–٥٠٠).</p>
  </div>`;
}
function qForm(id){
  const q=id?DB.qs.find(x=>x.id===id):{cat:tFilter!=='all'?tFilter:DB.cats[0]?.id,lvl:1,q:'',opts:['','','',''],a:0};
  openG(`<h2>${id?'تعديل سؤال':'سؤال جديد'}</h2><div class="form" style="margin-top:12px">
    <label>القسم<select id="fCat">${DB.cats.map(c=>`<option value="${c.id}" ${q.cat===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></label>
    <label>الصعوبة (نقاط لوحة الفرق)<select id="fLvl">${[1,2,3,4,5].map(l=>`<option value="${l}" ${q.lvl===l?'selected':''}>${AR(l*100)} — ${['سهل جداً','سهل','متوسط','صعب','صعب جداً'][l-1]}</option>`).join('')}</select></label>
    <label>نص السؤال<textarea id="fQ" rows="2">${esc(q.q)}</textarea></label>
    <label>الخيارات (حدّد الصحيح)</label>
    ${[0,1,2,3].map(i=>`<div class="optedit"><input type="radio" name="fA" value="${i}" ${q.a===i?'checked':''}><input id="fO${i}" value="${esc(q.opts[i]||'')}" placeholder="الخيار ${KEYS[i]}${i>1?' (اختياري)':''}"></div>`).join('')}
    <div class="row"><button class="btn gold" onclick="qSave('${id||''}')">حفظ</button><button class="btn ghost" onclick="closeG()">إلغاء</button>${id?`<button class="btn red sm" style="margin-inline-start:auto" onclick="qDel('${id}')">🗑️ حذف</button>`:''}</div>
  </div>`);
}
function qSave(id){
  const opts=[0,1,2,3].map(i=>$('fO'+i).value.trim());const a=+document.querySelector('input[name=fA]:checked').value;
  const text=$('fQ').value.trim();
  if(!text){toast('اكتب نص السؤال');return}
  if(opts.filter(Boolean).length<2){toast('أدخل خيارين على الأقل');return}
  if(!opts[a]){toast('الخيار الصحيح فارغ');return}
  const d={cat:$('fCat').value,lvl:+$('fLvl').value,q:text,opts,a};
  if(id)Object.assign(DB.qs.find(x=>x.id===id),d);else DB.qs.push({id:uid(),...d});
  save();closeG();toast('تم الحفظ ✔');tQs();
}
function qDel(id){ask('حذف هذا السؤال؟',()=>{DB.qs=DB.qs.filter(q=>q.id!==id);save();toast('تم الحذف');tQs()},'حذف')}
function tCats(){
  $('tBody').innerHTML=`<div class="card">
    ${DB.cats.map((c,i)=>`<div class="qitem" style="align-items:center"><input value="${esc(c.icon)}" style="width:56px;text-align:center" onchange="DB.cats[${i}].icon=this.value;save()"><input value="${esc(c.name)}" style="flex:1" onchange="DB.cats[${i}].name=this.value;save()">
      <button class="btn sm" onclick="catMove(${i},-1)" ${i===0?'disabled':''}>▲</button><button class="btn sm red" onclick="catDel(${i})">🗑️</button></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn gold sm" onclick="catAdd()">＋ قسم جديد</button><span class="mute" style="font-size:13px">ترتيب الأقسام = ترتيب غرف القصر</span></div></div>`;
}
function catAdd(){askText('اسم القسم الجديد',n=>{if(!n)return;DB.cats.push({id:uid(),name:n,icon:'⭐'});save();tCats()})}
function catMove(i,d){const j=i+d;[DB.cats[i],DB.cats[j]]=[DB.cats[j],DB.cats[i]];save();tCats()}
function catDel(i){const c=DB.cats[i];const n=DB.qs.filter(q=>q.cat===c.id).length;
  ask(`حذف قسم «${c.name}» و${n} سؤالاً بداخله؟`,()=>{DB.qs=DB.qs.filter(q=>q.cat!==c.id);DB.cats.splice(i,1);save();tCats()},'حذف')}
function tSet(){
  $('tBody').innerHTML=`<div class="card form">
    <h3>💾 نسخ الأسئلة ونقلها</h3>
    <p class="mute" style="margin:0;font-size:14px">البيانات محفوظة على هذا الجهاز. صدّر ملف الأسئلة ثم استورده على جهاز الفصل أو أرسله لزميل.</p>
    <div class="row"><button class="btn" onclick="expJson()">⬇️ تصدير الأسئلة</button><label class="btn" style="color:var(--ink);font-size:inherit">⬆️ استيراد ملف<input type="file" accept=".json,application/json" style="display:none" onchange="impJson(this.files[0])"></label></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h3>🔑 رمز المعلم</h3>
    <div class="row"><input id="newPin" type="password" inputmode="numeric" placeholder="رمز جديد" style="flex:1;width:auto"><button class="btn sm" onclick="setPin()">تغيير</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h3>🧹 إعادة الضبط</h3>
    <div class="row"><button class="btn red sm" onclick="ask('مسح لوحة الأبطال؟',()=>{DB.lb=[];save();toast('تم المسح')},'مسح')">مسح لوحة الأبطال</button>
    <button class="btn red sm" onclick="resetAll()">استعادة الأسئلة الأصلية</button></div>
  </div>`;
}
function setPin(){const p=$('newPin').value.trim();if(p.length<4){toast('الرمز ٤ أرقام على الأقل');return}DB.pin=p;save();toast('تم تغيير الرمز ✔');$('newPin').value=''}
function resetAll(){ask('سيتم حذف كل أسئلتك وأقسامك واستعادة الأسئلة الأصلية. متأكد؟',()=>{const d=defaults();d.pin=DB.pin;d.lb=DB.lb;d.sound=DB.sound;DB=d;save();toast('تمت الاستعادة');tTab('q')},'استعادة')}
async function expJson(){
  const data=JSON.stringify({app:'qasr',v:1,cats:DB.cats,qs:DB.qs},null,1);
  const name='أسئلة-حارس-القصر.json';
  try{const f=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'أسئلة حارس القصر'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function impJson(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cats)||!Array.isArray(d.qs))throw 0;
    const done=()=>{save();toast(`تم الاستيراد: ${AR(d.qs.length)} سؤال`);tTab('q')};
    ask('كيف تريد استيراد الأسئلة؟',()=>{DB.cats=d.cats;DB.qs=d.qs;done()},'استبدال الكل',()=>{d.cats.forEach(c=>{if(!DB.cats.some(x=>x.id===c.id))DB.cats.push(c)});d.qs.forEach(q=>{if(!DB.qs.some(x=>x.id===q.id))DB.qs.push(q)});done()},'دمج مع الموجود')}catch(e){toast('الملف غير صالح')}};
  r.readAsText(file);
}
document.addEventListener('keydown',e=>{
  if($('mq').classList.contains('on')&&M&&M.phase==='ans'){const i='1234'.indexOf(e.key);if(i>=0&&i<M.opts.length)mAns(i)}
  if($('s-aq').classList.contains('on')&&A&&!A.lock){const i='1234'.indexOf(e.key);if(i>=0&&i<A.cur.length)advAns(i)}
});
</script>
</body>
</html>
